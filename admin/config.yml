backend:
  name: github
  repo: foxah047-stack/cgbvrr.axiomorphe.ca
  branch: main

media_folder: assets/img
public_folder: /assets/img

collections:
  - name: posts
    label: Nouvelles
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Layout, name: layout, widget: hidden, default: post }
      - { label: Titre, name: title, widget: string }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Catégorie, name: categorie, widget: string }
      - { label: Projet, name: projet, widget: string }
      - { label: Auteur, name: auteur, widget: string }
      - { label: Extrait, name: excerpt, widget: text }
      - { label: Contenu, name: body, widget: markdown }

  - name: projects
    label: Projects / Projets
    folder: _projects
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{status}}"
    fields:
      - { label: Layout, name: layout, widget: hidden, default: project }
      - { label: Title, name: title, widget: string }
      - { label: Hero title, name: hero_title, widget: string, required: false }
      - label: Status
        name: status
        widget: select
        default: draft
        options:
          - { label: Draft - hidden from listing, value: draft }
          - { label: Review - direct URL only, value: review }
          - { label: Published - shown in project listing, value: published }
      - { label: Featured, name: featured, widget: boolean, default: false, required: false }
      - { label: Listing order, name: order, widget: number, default: 50, required: false, value_type: int }
      - { label: Subtitle, name: subtitle, widget: text, required: false }

      - label: Hero image
        name: hero_image
        widget: image
        required: false
        hint: "Use JPG/WebP. Hero images should be under 2 MB and about 2400 px wide. Use lowercase filenames with hyphens only."
      - { label: Hero image alt text, name: hero_alt, widget: string, required: false }
      - { label: Hero image caption, name: hero_caption, widget: text, required: false }

      - { label: Summary title, name: summary_title, widget: string, required: false }
      - { label: Summary, name: summary, widget: markdown, required: false }
      - { label: Intro, name: intro, widget: markdown, required: false }

      - { label: Show context section, name: context_show, widget: boolean, default: true, required: false }
      - { label: Context title, name: context_title, widget: string, required: false }
      - { label: Context body, name: context_body, widget: markdown, required: false }
      - { label: Show image 1, name: image_1_show, widget: boolean, default: false, required: false }
      - label: Image 1
        name: image_1
        widget: image
        required: false
        hint: "Normal page images should be JPG/WebP, under 1.5 MB, about 1600 px wide. Use lowercase filenames with hyphens only."
      - { label: Image 1 alt text, name: image_1_alt, widget: string, required: false }
      - { label: Image 1 caption, name: image_1_caption, widget: text, required: false }

      - { label: Show key concept section, name: key_concept_show, widget: boolean, default: true, required: false }
      - { label: Key concept title, name: key_concept_title, widget: string, required: false }
      - { label: Key concept body, name: key_concept_body, widget: markdown, required: false }

      - { label: Show process / steps section, name: process_show, widget: boolean, default: true, required: false }
      - { label: Process title, name: process_title, widget: string, required: false }
      - { label: Process intro, name: process_intro, widget: markdown, required: false }
      - label: Steps
        name: steps
        widget: list
        required: false
        fields:
          - { label: Step title, name: title, widget: string }
          - { label: Step text, name: text, widget: text, required: false }
      - { label: Show image 2, name: image_2_show, widget: boolean, default: false, required: false }
      - label: Image 2
        name: image_2
        widget: image
        required: false
        hint: "Normal page images should be JPG/WebP, under 1.5 MB, about 1600 px wide. Use lowercase filenames with hyphens only."
      - { label: Image 2 alt text, name: image_2_alt, widget: string, required: false }
      - { label: Image 2 caption, name: image_2_caption, widget: text, required: false }

      - { label: Show scope / stats section, name: scope_show, widget: boolean, default: true, required: false }
      - { label: Scope title, name: scope_title, widget: string, required: false }
      - { label: Scope body, name: scope_body, widget: markdown, required: false }
      - label: Stats
        name: stats
        widget: list
        required: false
        fields:
          - { label: Value, name: value, widget: string }
          - { label: Label, name: label, widget: text, required: false }

      - { label: Show related project/site cards, name: related_show, widget: boolean, default: true, required: false }
      - { label: Related section title, name: related_title, widget: string, required: false }
      - label: Related cards
        name: related_cards
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string, required: false }
          - { label: Title, name: title, widget: string }
          - { label: Text, name: text, widget: text, required: false }
          - { label: URL, name: url, widget: string, required: false }

      - { label: Show image 3, name: image_3_show, widget: boolean, default: false, required: false }
      - label: Image 3
        name: image_3
        widget: image
        required: false
        hint: "Normal page images should be JPG/WebP, under 1.5 MB, about 1600 px wide. Use lowercase filenames with hyphens only."
      - { label: Image 3 alt text, name: image_3_alt, widget: string, required: false }
      - { label: Image 3 caption, name: image_3_caption, widget: text, required: false }

      - { label: Show note / warning box, name: note_show, widget: boolean, default: true, required: false }
      - { label: Note title, name: note_title, widget: string, required: false }
      - { label: Note body, name: note_body, widget: markdown, required: false }

      - { label: Show closing section, name: closing_show, widget: boolean, default: true, required: false }
      - { label: Closing title, name: closing_title, widget: string, required: false }
      - { label: Closing body, name: closing_body, widget: markdown, required: false }
      - { label: Closing link label, name: closing_link_label, widget: string, required: false }
      - { label: Closing link URL, name: closing_link_url, widget: string, required: false }
      - { label: Extra body content, name: body, widget: markdown, required: false }
