intro_body_en: The Council brings together coordination, project management and field-monitoring roles. The roster below can be reorganized directly through the CMS without imposing a rigid organizational chart.
intro_body_fr: Le CGBVRR réunit des rôles de coordination, de gestion de projets et de surveillance terrain. L’équipe ci-dessous peut être réorganisée directement dans le CMS, sans imposer un organigramme trop rigide.
items:
  - type: group
    label_en: Internal roles
    label_fr: Rôles internes
    title_en: Management and coordination
    title_fr: Coordination et gestion
    description_en: Direction, project coordination, sector supervision and administrative follow-up.
    description_fr: Direction, coordination des projets, supervision des secteurs et suivi administratif.
  - type: profile
    title_en: Executive director
    title_fr: Directeur général
    description_en: Organizational leadership, partner relations and overall priorities.
    description_fr: Direction de l’organisation, relations avec les partenaires et priorités générales.
