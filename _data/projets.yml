  description_fr: "15 000 photographies aériennes et cartographie LIDAR complète de plus de 400 km de rivières — faisant de la Restigouche l'un des systèmes fluviaux à saumon les mieux documentés en Amérique du Nord."
  description_en: "15,000 aerial photographs and complete LIDAR mapping of more than 400 km of rivers — making the Restigouche one of the best-documented salmon river systems in North America."

