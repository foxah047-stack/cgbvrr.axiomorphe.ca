- titre_fr: "WATERSHADE"
  titre_en: "WATERSHADE"
  annee_fr: "2023 — EN COURS"
  annee_en: "2023 — ONGOING"
  statut_fr: "Actif"
  statut_en: "Active"
  is_active: true
  description_fr: "Cartographie des refuges thermiques sur plus de 400 km de rivière où le saumon se réfugie lors des épisodes de chaleur. Combine l'imagerie thermique aérienne, les relevés de terrain et la modélisation hydrologique pour prioriser les sites d'intervention."
  description_en: "Mapping thermal refuges across more than 400 km of river where salmon take shelter during heat events. Combines aerial thermal imagery, field surveys and hydrological modelling to prioritize intervention sites."

