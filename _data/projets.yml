  statut_en: "Active"
  is_active: true
  description_fr: "Relevés annuels par électropêche et télémétrie PIT pour suivre la migration des juvéniles de saumon et les taux de survie dans six sous-bassins."
  description_en: "Annual surveys using electrofishing and PIT telemetry to track juvenile salmon migration and survival rates across six sub-basins."

- titre_fr: "Réseau de surveillance anti-braconnage"
  titre_en: "Anti-poaching camera network"
  annee_fr: "2025 — EN COURS"
  annee_en: "2025 — ONGOING"
  statut_fr: "Actif"
  statut_en: "Active"
  is_active: true
  description_fr: "Déploiement de caméras à distance aux bassins prioritaires en coordination avec la GRC et la Sûreté du Québec, pour réduire la pression de prélèvement illégal pendant la fraie."
  description_en: "Deployment of remote cameras at priority pools in coordination with the RCMP and the Sûreté du Québec, to reduce illegal harvest pressure during spawning."

